[tool.ruff]
line-length = 120
target-version = "py312"
# 설계 문서(agents_design/*.md)의 코드 블록은 주석을 정렬한 예시라 formatter 대상이 아니다.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM", "G"]
# 코드 줄 길이는 formatter 가 맞춘다. 주석·docstring 은 formatter 가 줄이지 않고 한글이 폭 2로 계산돼 E501 이 한국어 주석마다 걸린다.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.pytest.ini_options]
markers = ["e2e: 배포된 서비스나 실제 KIS 에 요청을 보낸다. 기본 실행에서 빠진다 (pytest -m e2e)"]
addopts = "-m 'not e2e'"
